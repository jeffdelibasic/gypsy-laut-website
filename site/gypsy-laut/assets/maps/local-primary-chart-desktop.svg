    <circle cx="530" cy="515" r="2.8"/><circle cx="609" cy="551" r="2.8"/>
    <circle cx="640" cy="566" r="2.8"/><circle cx="764" cy="599" r="2.8"/>
    <circle cx="540" cy="470" r="2.8"/><circle cx="835" cy="627" r="2.8"/>
  </g>
  <g color="#d9ddda" opacity=".84">
    <use href="#chart-surf" transform="translate(73 138) scale(.52)"/>
    <use href="#chart-surf" transform="translate(73 165) scale(.52)"/>
    <use href="#chart-surf" transform="translate(73 192) scale(.52)"/>
    <use href="#chart-surf" transform="translate(73 219) scale(.52)"/>
    <use href="#chart-surf" transform="translate(73 246) scale(.52)"/>
    <use href="#chart-surf" transform="translate(283 443) scale(.52)"/>
  </g>
  <g color="#e8dfcf" opacity=".9">
    <use href="#chart-mask" transform="translate(504 138) scale(.56)"/>
    <use href="#chart-mask" transform="translate(525 277) scale(.56)"/>
    <use href="#chart-mask" transform="translate(650 257) scale(.56)"/>
    <use href="#chart-manta" transform="translate(860 624) scale(.56)"/>
  </g>
  <g color="#173249" opacity=".86">
    <use href="#chart-mask" transform="translate(628 404) scale(.56)"/>
    <use href="#chart-manta" transform="translate(628 486) scale(.56)"/>
  </g>
  <!-- Broad water cues, not fishing pins: keep clear of the Batu Abah eastern core area. -->
  <g color="#c5d1cc" opacity=".66">
    <use href="#chart-hook" transform="translate(719 201) scale(.51)"/>
    <use href="#chart-hook" transform="translate(531 610) scale(.51)"/>
    <use href="#chart-hook" transform="translate(985 608) scale(.51)"/>
  </g>
  <g fill="none" stroke="#f3eadd" stroke-width="1.1">
    <circle cx="276" cy="375" r="15" stroke-opacity=".65"/>
  </g>
  <g color="#f3eadd"><use href="#chart-anchor" transform="translate(267 366) scale(.56)"/></g>
  <g transform="translate(1130 93)" fill="none" stroke="#d8c6a8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <circle r="24" stroke-opacity=".6"/><path d="M0 13V-13m0 0-4 6m4-6 4 6"/>
  </g>

  <g id="chart-labels" font-family="DM Sans, Segoe UI, sans-serif">
    <g letter-spacing="1.5" fill="#173249" text-anchor="middle">
