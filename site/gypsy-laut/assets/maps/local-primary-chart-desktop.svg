    <text x="91" y="373" font-size="11" letter-spacing="2.2" fill="#f3eadd">GYPSY LAUT</text>
    <text x="91" y="396" font-size="19" letter-spacing=".3" fill="#f3eadd">Mushroom Bay</text>
    <text x="31" y="642" font-size="10" letter-spacing="1.5" fill="#a9c0c0">8° S / 115° E · ILLUSTRATIVE</text>
    <text x="1130" y="60" fill="#d8c6a8" text-anchor="middle" font-size="13" letter-spacing="2">N</text>
