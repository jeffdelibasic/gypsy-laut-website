<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 720" role="img" aria-labelledby="title desc">
  <title id="title">The islands around Mushroom Bay</title>
  <desc id="desc">Simplified illustrative chart for small screens. Gypsy Laut at Mushroom Bay is the base; surf breaks, reef stops and separate Manta Bay and Manta Point areas appear around Lembongan, Ceningan and Penida. Not for navigation or activity planning.</desc>
